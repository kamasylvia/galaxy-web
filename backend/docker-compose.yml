services:
  galaxy-web:
    build: .
    env_file:
      - .env               # APP_API_KEY, OPENROUTER_API_KEY, GALAXY_PG_* (see docs/deploy.md)
    environment:
      # PG defaults to host-gateway (timescaledb on the host / LAN);
      # override GALAXY_PG_HOST in .env for QNAP/other remotes.
      - GALAXY_PG_HOST=${GALAXY_PG_HOST:-host.docker.internal}
    ports:
      - "8000:8000"
    volumes:
      # OpenBB credential store (akshare key for HK/realtime chains;
      # optional in pure A-share deployments, see docs/deploy.md)
      - ./user_settings.json:/root/.openbb_platform/user_settings.json:ro
    restart: unless-stopped
